# fly.toml app configuration file generated for tacticcraft on 2026-09-17T13:57:03+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tacticcraft'
primary_region = 'nrt'

[build]

[env]
  # 로그인 세션 쿠키에 Secure 플래그를 켠다 — force_https=true라 항상
  # HTTPS로 서빙되므로 로컬 개발(config.py 기본값 False)과 달리 여기서만
  # true로 둔다(TO-DO 59). CORS_ORIGINS는 안 둔다 — 프론트·백엔드가 같은
  # 오리진(tacticcraft.fly.dev)에서 서빙되므로 CORS 자체가 발생하지 않는다.
  COOKIE_SECURE = 'true'

[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
