# TactiCore 컨테이너 실행 (배포용, 단일 이미지 — TO-DO 10번).
#
# 개발 중에는 이걸 쓰지 않고 로컬 2프로세스(Vite 5173 + uvicorn 8000)를 쓴다.
# Windows에서 컨테이너 안의 Vite HMR은 파일 변경 감지가 자주 실패하고
# 개발 루프가 느려지기 때문이다.
#
# 이 컨테이너는 프론트(빌드된 정적 파일)와 백엔드 API를 8000 포트 하나로
# 같은 오리진에서 서빙한다 — 브라우저에서 http://localhost:8000 하나만 열면 된다.
#
#   docker compose up -d --build     기동
#   docker compose logs -f           로그
#   docker compose down              종료

services:
  tacticore:
    build:
      context: .
    image: tacticore
    container_name: tacticore
    ports:
      - "8000:8000"
    volumes:
      # SQLite DB를 호스트에 남긴다. 컨테이너를 지우고 다시 만들어도
      # ./data/tacticore.db 는 그대로 남고, 호스트에서 바로 백업할 수 있다.
      - ./data:/app/data
    environment:
      # 같은 오리진에서 서빙되므로 평소엔 CORS가 필요 없다. 그래도 두는 이유는
      # 로컬 Vite(5173)를 프론트로 띄운 채 이 컨테이너를 API 서버로만 붙여
      # 쓰는 경우(배포 전 API 동작 확인 등)를 계속 허용하기 위해서다.
      - CORS_ORIGINS=http://localhost:5173,http://localhost:8000
      - APP_VERSION=1.0.0
    restart: unless-stopped
