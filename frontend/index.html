<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 검색엔진 소유권 확인(2026-09-18, "구글이랑 네이버 둘 다 등록할게") —
         Google Search Console·네이버 서치어드바이버 각각이 발급한 값을
         그대로 붙여넣는다. 두 서비스 다 계정 소유자만 받을 수 있는 값이라
         사용자가 로그인해서 확인한 걸 가져와 넣었다. -->
    <meta name="google-site-verification" content="AqiTiXXRfU_U4XBiou0hES4UsoMMG0Y0K9HQVTaZvhA" />
    <meta name="naver-site-verification" content="048907d5c3e24ce6b8b4b46643f5ab6ed4ba4d56" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO(2026-09-17, "축구 전술 사이트로 검색했을때도 뜨게") — <title>에
         브랜드명만 있으면 일반 키워드 검색에서 걸릴 확률이 거의 없다.
         "TactiCraft"를 맨 앞에 둬 브랜드 정체성은 유지하면서 뒤에 실제
         검색 키워드를 붙였다 — 검색 결과 제목·브라우저 탭 둘 다 이 값을
         쓴다(탭에서 "TactiCraft"가 여전히 먼저 보임). lang도 en→ko로
         수정 — CLAUDE.md에 명시된 "한국어 단일 언어" UI인데 html lang이
         틀려 있었다(검색엔진이 한국 사용자에게 이 페이지를 덜 보여줄 수
         있는 실제 SEO 결함). -->
    <title>TactiCraft — 축구 전술 분석 & 공유</title>
    <!-- 메타 디스크립션·OG/Twitter 카드(2026-09-17, "파비콘, 오지 이미지 사이트
         디스크립션 추가해줘") — 문구는 홈 화면 태그라인(EditorPage.tsx)과
         똑같이 맞췄다(따로 새 카피를 쓰면 화면 문구와 어긋날 수 있어서).
         og:image는 상대경로가 카카오톡·디스코드 등 일부 크롤러에서 안정적으로
         안 읽혀서 절대 URL로 못 박는다 — 배포 도메인이 바뀌면 같이 갱신해야
         한다(지금은 tacticraft.fly.dev, 커스텀 도메인 연결 시 갱신 필요). -->
    <meta name="description" content="나만의 전술을 만들고, 국면별로 비교하고, 카드로 공유하세요." />
    <!-- 검색엔진용 추가 메타데이터(2026-09-17, "검색엔진에 걸리게 메타데이터
         설정해줘") — robots.txt/sitemap.xml·title·h1·lang(바로 위 커밋)에
         이어지는 작업.
         - keywords는 구글은 2009년부터 순위에 안 쓴다(악용돼 신호로서 폐기)
           — 그래도 네이버 등 일부 국내 검색엔진·구식 크롤러는 여전히
           참고할 수 있어 harmless하게 넣어둔다. 순위를 올려주는 핵심은
           title/description/h1/본문 텍스트 쪽이다.
         - canonical은 이 앱이 SPA라 같은 화면이 다른 쿼리스트링으로도
           열릴 수 있는데(예: /versus?a=33), 검색엔진이 그런 변형을
           별도 페이지로 오인해 순위를 분산시키지 않도록 "정식 URL은
           이거다"를 명시한다. -->
    <meta name="keywords" content="축구 전술, 전술판, 축구 포메이션, 전술 분석, 축구 전술 시뮬레이터, 전술 대결, 축구 커뮤니티, 축구 전술 공유" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tacticraft.fly.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TactiCraft" />
    <meta property="og:title" content="TactiCraft" />
    <meta property="og:description" content="나만의 전술을 만들고, 국면별로 비교하고, 카드로 공유하세요." />
    <meta property="og:url" content="https://tacticraft.fly.dev/" />
    <meta property="og:image" content="https://tacticraft.fly.dev/og-image.jpg" />
    <meta property="og:image:width" content="1464" />
    <meta property="og:image:height" content="812" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TactiCraft" />
    <meta name="twitter:description" content="나만의 전술을 만들고, 국면별로 비교하고, 카드로 공유하세요." />
    <meta name="twitter:image" content="https://tacticraft.fly.dev/og-image.jpg" />
    <!-- 구조화 데이터(JSON-LD, Schema.org WebSite) — 검색엔진이 사이트
         이름·URL·설명을 명확한 구조로 읽게 해서, 구글 검색 결과에 사이트명이
         브랜드로 인식되거나(예: 사이트링크 검색창) 리치 스니펫에 도움이 될
         수 있다. 이 앱엔 전역 검색 기능이 없어 SearchAction은 넣지 않았다. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TactiCraft",
        "url": "https://tacticraft.fly.dev/",
        "description": "나만의 전술을 만들고, 국면별로 비교하고, 카드로 공유하세요.",
        "inLanguage": "ko"
      }
    </script>
    <!-- Hallmark 감사(2026-09-11) 후 폰트 페어링 도입 — 본문은 IBM Plex Sans KR
         (한글 전체 지원). 헤딩은 원래 IBM Plex Mono(라틴 전용)로 시도했으나,
         이 앱은 한국어 단일 언어라 헤딩 대부분이 "단어 스페이스 낀 한글
         문구"다 — Mono가 커버 못 하는 한글은 Sans KR로 글자 단위 폴백되는데,
         스페이스(U+0020) 자체는 Mono의 넓은 고정폭 그대로 남아 한글 단어
         사이 간격이 유독 벌어져 보이는 문제를 실제 화면에서 확인했다.
         대신 한글까지 포함하는 진짜 monospace 폰트 Nanum Gothic Coding으로
         교체 — 폰트 하나가 라틴·한글 전부 같은 고정폭이라 이 문제가 없다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- crossorigin="anonymous"(2026-09-21, PNG 카드 코멘트가 컴퓨터에서만
         잘리는 리포트 대응) — html-to-image가 카드를 foreignObject SVG로
         직렬화해 이미지 리소스로 새로 렌더링할 때, 그 렌더링 컨텍스트는 이
         문서에 등록된 @font-face(IBM Plex Sans KR 등)를 상속받지 못한다 —
         원래 skipFonts:true로 이 임베딩 단계 자체를 건너뛰어서(CORS 없는
         이 링크는 cssRules를 못 읽어 SecurityError가 났었다) 캡처된 PNG는
         항상 OS 기본 폰트로 대체 렌더링됐다. 화면 측정(useFitFontSize)은
         실제 웹폰트 기준인데 캡처는 OS 폴백 기준이라 폭이 어긋났고, 이
         폴백 폭이 OS마다 달라 컴퓨터에서만 텍스트가 박스를 넘쳤다.
         Google Fonts css2 엔드포인트는 Access-Control-Allow-Origin: *를
         보낸다(curl로 확인) — crossorigin을 달아 CORS 모드로 가져오면
         html-to-image가 cssRules를 읽어 실제로 폰트를 embed할 수 있다
         (exportImage.ts의 skipFonts 제거와 함께 적용). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
